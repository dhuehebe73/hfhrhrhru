name: Baron AI derle
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Keystore
        run: |
          KEY=${{ runner.temp }}/baron.jks
          if [ -f "$KEY" ]; then echo "cached"; else
            keytool -genkeypair -v -keystore "$KEY" -alias baron \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass baron123 -keypass baron123 \
              -dname "CN=Baron,O=Baron,L=IST,C=TR"
          fi
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
      - run: ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: baron-ai-apk
          path: app/build/outputs/apk/**/*.apk
